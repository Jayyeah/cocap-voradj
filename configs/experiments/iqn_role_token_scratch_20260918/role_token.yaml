extends: ../iqn_zstate_b3_20260918/z_state.yaml

# R-line scratch control.  The resolved reward, dynamics, sensing, topology,
# task schedule, replay, and IQN settings inherit from the current Z line.
# Only the policy observation semantics differ: binary role tokens remain in
# self/friend tokens, while the late-fusion shortcut is absent.
total_timesteps: 200000
run_name: iqn_role_token_scratch_20260918
output_root: artifacts/2026-09-18_iqn_role_token_scratch

checkpointing:
  full_resume: true
  full_resume_path: artifacts/2026-09-18_iqn_role_token_scratch/checkpoints/resume_latest.pt

perception:
  self_feature_dim: 9
  include_is_pursuing: true
  include_z_state: false
  friend_ordering_mode: physical_only

z_state:
  enabled: false
  lambda: 0.95
  eta: 0.85
  update_semantics: synchronous_previous_decision_state

iqn:
  self_feature_dim: 9
  pursuer_feature_dim: 7
  pursuing_embed_dim: 0
  include_is_pursuing: true
  include_z_state: false
  pursuing_late_fusion: false
  checkpoint_freq: 25000

experiment_metadata:
  series_label: iqn_role_token_scratch_20260918
  scope: scratch IQN control with binary self/friend role tokens and physical-only friend ordering
  baseline_config: configs/experiments/iqn_zstate_b3_20260918/z_state.yaml
  baseline_line: experiment/iqn-zstate-b3-20260918
  observation_only_difference: role token versus continuous z token in the final observation column
  friend_ordering: physical_only
  pursuing_late_fusion: false
  scratch_initialization: true
  teacher_warm_start: false
  bc_or_distillation: false
  automatic_stop_step: 200000
  checkpoint_milestones: [25000, 50000, 75000, 100000, 125000, 150000, 175000, 200000]

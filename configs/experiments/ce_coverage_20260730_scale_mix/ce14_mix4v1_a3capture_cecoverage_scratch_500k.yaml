experiment_metadata:
  series_label: ce14_a3_old_capture_ce_coverage_mix4v1
  training_start: scratch
  capture_semantics: Keeps the A3 old-mix capture branch, APF-v2_fixed, K10 capture-to-coverage release delay, hard boundary/death, and safety penalties.
  coverage_semantics: Replaces only the coverage/post-capture objective with centroid-energy CE coverage over free-space obstacle-masked Voronoi cells.
  excluded_legacy_coverage_rewards: No legacy CV/center terminal bonus, no speed-settle success reward, no early low-speed shaping, and no old coverage terminal repeat reward.
  ce_control_energy: Uses the CE8 delayed control-energy schedule, lambda_v=0 until 200k then 0.0005.
  mix_post_end: After capture, stop when CE coverage succeeds; otherwise continue until post_capture_coverage_window_steps=300.
  visualization_rule: Pure coverage rollout may draw cell centers; mix rollouts must not draw cell centers.

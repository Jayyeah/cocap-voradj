    is set to -160 for clarity but remains unused by hard/death boundary mode.
  series_label: a3_apfnew_sqrtn_curriculum
  coverage_supplement: Uses the existing voradj_mixed_coverage schedule, four replay
    buffers, and recovery_pure coverage supplement.
  coverage_speed_semantics: 'Coverage/post-capture success keeps geometry and settled

extends: ../positive_feedback_ladder_20260807/stage5b_mixed_aw.yaml

run_name: legacy_voradj_oldmix_allagent_4p1e1obs_200k_aw_20260810
seed: 2026080902
device: cuda:0

env:
  num_pursuers: 4
  num_evaders: 1
  num_obstacles: 1
  episode_max_length: 1500
  pre_capture_max_length: 1000

evader:
  max_speed: 3.5
  a: [-0.4, 0.0, 0.4]
  w: [-0.5235987755982988, -0.2617993877991494, 0.0, 0.2617993877991494, 0.5235987755982988]
  action_mode: unicycle
  autonomous: true
  perception_range: 20.0
  init_speed: 0.0

apf:
  force_range: 15.0
  out_bound_k: 20.0
  boundary_k: 10.0
  velocity_k: 1.0
  repulsion_k: 5000.0
  mass: 500.0
  force_exponent: 2
  min_vel: 1.0
  acc_threshold: 0.1
  goal_attraction_k: 0.0
  goal_noise_std: 0.0
  version: v2_fixed
  self_state_mode: theta_speed
  min_clearance: 0.2

perception:
  observation_mode: voronoi_adjacency
  topology: legacy_voradj
  evader_observation_mode: apf_compatible
  global_evader_visibility: false

training:
  total_env_steps: 200000
  checkpoint_interval_env_steps: 25000
  diagnostic_eval_interval_env_steps: 25000
  periodic_checkpoint_replay_mode: rolling_latest
  scene_cycle: [mixed_crms, pure_ce]
  optimizer_unit: joint_transition_all_active_agents
  replay_sampling: uniform_joint
  focal_training: false
  focal_quota: null

evaluation:
  diagnostic_scenes: [capture, pure_ce, mixed_crms]
  episodes_per_scene: 20
  deterministic: true
  diagnostic_rollout_cap: 400

reward:
  coverage_objective_version: centroid_energy_v0
  coverage_ce_reward_scale: 10.0
  coverage_ce_pbrs_enabled: true
  coverage_ce_pbrs_kappa: 1.0
  coverage_ce_pbrs_reset_mode: phase_and_all_terminal
  coverage_ce_speed_weight: 0.0
  coverage_ce_speed_weight_schedule:
    - step: 0
      value: 0.0
  coverage_ce_acceleration_weight: 0.0
  coverage_ce_angular_velocity_weight: 0.0
  coverage_ce_success_rms_threshold: 0.05
  coverage_ce_success_max_threshold: 0.10
  coverage_ce_success_hold_steps: 30
  coverage_ce_min_active_pursuers: 4
  coverage_cv_loose_area_cv_threshold: 0.20
  min_active_pursuers: 4

  capture_reward_mode: legacy
  capture_timestep_penalty: null
  voradj_grid_size: 60
  omega_approach: 1.0
  omega_mean_shift: 2.0
  omega_front: 0.5
  c_d: 3.0
  mean_shift_cell_size: 1.5
  mean_shift_inner_margin: 2.0
  mean_shift_outer_margin: 2.0
  mean_shift_sense_radius: 35.0
  mean_shift_occupancy_radius: 4.0
  mean_shift_obstacle_margin: 2.0
  mean_shift_boundary_margin: 0.5
  mean_shift_radial_sigma: 2.0
  mean_shift_progress_clip: 3.0
  front_theta: 1.0471975511965976
  front_k: 8.0
  front_min_evader_speed: 0.001
  front_radial_sigma: 4.0
  k_required: 3
  r_e: 8.0
  max_angle_gap: 3.141592653589793
  max_angle_ratio: 3.0
  capture_stationary_enabled: true
  capture_stationary_speed_threshold: 0.2
  capture_stationary_hold_steps: 10
  capture_stationary_min_pursuers: 2
  post_capture_coverage_window_steps: 500

voradj:
  perception_topology_version: legacy_voradj
  capture_adjacency_obstacle_mode: legacy_assign
  voronoi_obstacle_mode: free_mask_projected
  enemy_sensing_radius: 20.0
  obstacle_sensing_radius: 20.0
  local_sensing_uses_surface_distance: true
  vct_ls_apply_release_delay: false
  support_reward_blend_enabled: false
  is_pursuing_release_delay_steps: 10
  center_sqrt_n_normalization_enabled: true

tasks:
  capture:
    env:
      num_pursuers: 4
      num_evaders: 1
      num_obstacles: 1
      episode_max_length: 1000
      pre_capture_max_length: 1000
      pursuer_spawn_mode: map_random
      evader_spawn_mode: map_random
      pursuer_spawn_min_sep: 15.0
    voradj:
      capture_episode_ends_on_capture: true
      capture_episode_success_on_capture: true
  pure_ce:
    env:
      num_pursuers: 4
      num_evaders: 0
      num_obstacles: 1
      episode_max_length: 1500
      pre_capture_max_length: 0
      pursuer_spawn_mode: inner_random_cluster
      pursuer_spawn_min_sep: 7.0
    voradj:
      capture_episode_ends_on_capture: false
      capture_episode_success_on_capture: false
  mixed_crms:
    env:
      num_pursuers: 4
      num_evaders: 1
      num_obstacles: 1
      episode_max_length: 1500
      pre_capture_max_length: 1000
      pursuer_spawn_mode: map_random
      evader_spawn_mode: map_random
      pursuer_spawn_min_sep: 15.0
    reward:
      post_capture_coverage_window_steps: 500
    voradj:
      capture_episode_ends_on_capture: false
      capture_episode_success_on_capture: false

experiment_metadata:
  series_label: positive_feedback_ladder_parallel_20260809
  stage: legacy_voradj_oldmix_allagent_ablation_200k_aw
  training_start: scratch
  capture_semantics: legacy VorAdj all-entity sites, adjacency visibility, APF-v2_fixed, approach=1, old-MS=2, front=0.5
  coverage_semantics: CE centroid-energy with free-mask coverage geometry
  phase_semantics: K10 smooths temporary adjacency loss while an enemy remains; after all enemies are captured the role switches directly to coverage
  episode_mix: mixed_crms:pure_ce=1:1
  replay_mix: uniform over stored joint transitions; role metadata is diagnostics-only
  diagnostic_signals: capture rate, detection rate/step, initial/final/min enemy distance and progress, CE progress
  storage_semantics: model at every 25k; only latest replay remains resumable; final bundle is full
  resource_placement: cuda:0 with Pure-CE; wait for old Stage4A on cuda:0 to finish; never use Baseline-A cuda:1

spec_version: maadpg-paper-v1
purpose: matched_post_warmup_health_pilot
variants: [maddpg, maadpg]
training_seeds: [2026082301]
environment_step_budget: 25000
device_assignment:
  maddpg: cuda:0
  maadpg: cuda:1
paper_hyperparameters_unchanged:
  gamma: 0.95
  actor_learning_rate: 0.0005
  critic_learning_rate: 0.001
  tau: 0.01
  replay_capacity: 1000000
  batch_size: 1024
  hidden_dims: [128, 128]
assumed_schedule:
  replay_warmup: 10000
  updates_per_environment_step: 1
  gradient_steps_per_update: 1
  gradient_clipping: null
  exploration: independent_ou_linear_decay
checkpoint_every_steps: 5000
model_every_steps: 5000
diagnostic_every_steps: 500
post_pilot_evaluation:
  mode: actor_only
  partition: tuning
  seeds: [410000, 410019]
acceptance:
  - both variants reach 25000 environment steps
  - both variants begin updates at replay size 10000
  - no nonfinite loss TD error gradient Q value or action
  - action norms remain within the canonical unit disk
  - rolling checkpoint restores exactly after warmup
  - MAADPG counterfactuals leave environment target and RNG unchanged
  - diagnostics expose critic and actor gradients without silent clipping

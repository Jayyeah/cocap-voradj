  target_kl: 0.02
  value_norm: true
  value_norm_beta: 0.99999
  value_norm_epsilon: 1.0e-05
actor:
  hidden_dim: 256
  num_heads: 8
  num_layers: 4
  self_feature_dim: 9
  max_pursuers: 8
  max_evaders: 8
  max_obstacles: 5
  pursuing_embed_dim: 8
  dropout: 0.0
critic:
  hidden_dim: 256
  num_heads: 8
  num_layers: 4
  self_feature_dim: 9
  max_agents: 4
  max_evaders: 8
  max_obstacles: 5
actor_head:
  orthogonal_policy_head: true
  output_gain: 0.01
rollout_length: 256
reward_clock_offset: 2000000
scene_schedule:
  - capture
eval_seed_base: 2026191501
eval_episodes_per_mode: 20
allowed_scientific_changes:
  episode_max_length: [3000, 1000]
  pre_capture_max_length: [0, 1000]
